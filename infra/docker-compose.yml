services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: supbunker
      POSTGRES_PASSWORD: supbunker
      POSTGRES_DB: supbunker
    ports:
      - "5432:5432"
    volumes:
      - supbunker_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supbunker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supbunker_db:
