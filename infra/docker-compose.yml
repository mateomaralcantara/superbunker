services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: supbunker
      POSTGRES_PASSWORD: supbunker
      POSTGRES_DB: supbunker
    ports:
      - "5432:5432"
    volumes:
      - supbunker_db:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    ports:
      - "4222:4222"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - supbunker_minio:/data

volumes:
  supbunker_db:
  supbunker_minio:
